excel:
  skip_rows: 0   
  indicator_column: "Indicator"   
  unit_column: "Unit"
  notes_column: "Notes on the data"
  
  # Detect topic rows
  metric_category_column: "metric_category"
  detect_topic_rows: true
  
  # Year columns (auto-detect nếu null) - sẽ detect 2021, 2022, 2023, 2024
  year_columns: null
  
  # Columns chứa baseline
  baseline_patterns:
    - "Baseline value.*\\((\\d{4})\\)"  # Extract year từ "Baseline value (2018)"
  
  baseline_column: "Baseline value (2018)"  # Column name chính xác

# Topic classification rules
topics:
  Environment:
    keywords: ["emission", "energy", "water", "waste", "climate", "GHG", "greenhouse"]
  Social:
    keywords: ["employee", "labor", "safety", "human rights", "workforce", "diversity"]
  Governance:
    keywords: ["board", "ethics", "compliance", "governance", "bribery"]

# Category extraction patterns
categories:
  - pattern: "(?i)greenhouse gas"
    name: "Greenhouse gas"
  - pattern: "(?i)scope [123]"
    name: "Greenhouse gas"
  - pattern: "(?i)climate change"
    name: "Climate change"
  - pattern: "(?i)plastic"
    name: "Plastics reduction"
  - pattern: "(?i)own workforce|employee"
    name: "Own workforce"
  - pattern: "(?i)business conduct"
    name: "Business conduct"