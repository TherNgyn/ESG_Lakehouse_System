services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data 
    command: server /data --console-address ":9001"
    networks:
      - esg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      
  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 15;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/bronze --ignore-existing || true;
      /usr/bin/mc mb myminio/silver --ignore-existing || true;
      /usr/bin/mc mb myminio/gold --ignore-existing || true;
      /usr/bin/mc mb myminio/metadata --ignore-existing || true;
      /usr/bin/mc anonymous set download myminio/bronze;
      /usr/bin/mc anonymous set download myminio/silver;
      /usr/bin/mc anonymous set download myminio/gold;
      echo 'Buckets created successfully';
      sleep infinity;
      "
    networks:
      - esg-network
      
  spark-master:
    build: ./spark-apps
    image: spark-custom:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    ports:
      - "${SPARK_UI_PORT}:8080"
      - "7077:7077"
      - "4040:4040"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 20s
      timeout: 10s
      retries: 3
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-apps:/opt/spark-apps
      - ./configs:/opt/spark-apps/configs
      - ./utils:/opt/utils
      - ./scripts:/opt/scripts
      - ./datasets:/opt/spark-data/input
    networks:
      - esg-network

  spark-worker:
    build: ./spark-apps
    image: spark-custom:3.5.3-python3
    # container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-4}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-6g}
      - SPARK_EXECUTOR_MEMORY=5g
      - SPARK_MASTER_URL=spark://spark-master:7077
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-apps:/opt/spark-apps
      - ./configs:/opt/spark-apps/configs
      - ./utils:/opt/utils
      - ./scripts:/opt/scripts
      - ./datasets:/opt/spark-data/input
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - esg-network

  spark-submit:
    build: ./spark-apps
    image: spark-custom:3.5.3-python3
    container_name: spark-submit
    hostname: spark-submit
    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-apps:/opt/spark-apps
      - ./configs:/opt/spark-apps/configs
      - ./utils:/opt/utils
      - ./scripts:/opt/scripts
      - ./datasets:/opt/spark-data/input
    working_dir: /opt/spark-apps
    environment:
      - PYSPARK_PYTHON=python3
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: tail -f /dev/null
    networks:
      - esg-network

  chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    ports:
      - "4444:4444"
      - "7900:7900" 
    shm_size: "2gb"
    networks:
      - esg-network

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow
    depends_on:
      - postgres
      - spark-master
      - minio
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark-apps:/opt/airflow/spark-apps
      - ./airflow/logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT}:8080"
    command: standalone
    networks:
      - esg-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - esg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "${JUPYTER_PORT}:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./datasets:/home/jovyan/data    
    command: start-notebook.sh --NotebookApp.token='esg123'
    networks:
      - esg-network

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.latest
    container_name: dbt
    depends_on:
      - postgres
    volumes:
      - ./dbt-project:/usr/app
      - ./dbt-profiles:/root/.dbt
    working_dir: /usr/app
    entrypoint: >
      sh -c "pip install dbt-trino && tail -f /dev/null"
    networks:
      - esg-network

  trino:
    image: trinodb/trino:478
    container_name: trino
    hostname: trino
    ports:
      - "${TRINO_PORT}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config:/etc/trino/config
    networks:
      - esg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5

  metricflow:
    build: ./metricflow
    container_name: metricflow
    depends_on:
      trino:
        condition: service_healthy
    environment:
      - DBT_PROJECT_DIR=/usr/app
      - DBT_PROFILES_DIR=/usr/app
    volumes:
      - ./dbt-profiles:/usr/app
      - ./dbt-project:/usr/app
      - ./metricflow:/usr/app
    working_dir: /usr/app
    ports:
      - "${METRICFLOW_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: gunicorn --bind 0.0.0.0:8080 --workers 4 --timeout 120 api_server:app
    networks:
      - esg-network

  streamlit:
    build: ./streamlit-app  
    container_name: streamlit-app
    depends_on:
      trino:
        condition: service_healthy
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"  
    volumes:
      - ./streamlit-app:/app
    working_dir: /app
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]  # Nếu không dùng Dockerfile
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=user
    networks:
      - esg-network
volumes:
  minio-data:
  postgres-data:
  powerbi-gateway-data:

networks:
  esg-network:
    driver: bridge