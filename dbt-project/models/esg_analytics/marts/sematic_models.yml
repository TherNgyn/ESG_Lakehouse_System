version: 2

saved_queries: []

semantic_models:
  - name: company
    description: "Company master data for filtering and grouping"
    model: ref('dim_company')
    defaults:
      agg_time_dimension: created_at
    
    entities:
      - name: company
        type: primary
        expr: company_key
    
    dimensions:
      - name: company_name
        type: categorical
        expr: company_name
      - name: symbol
        type: categorical
        expr: symbol
      - name: sector
        type: categorical
        expr: sector_normalized
      - name: industry
        type: categorical
        expr: industry_normalized
      - name: country
        type: categorical
        expr: country_normalized
      - name: city
        type: categorical
        expr: city
      - name: region
        type: categorical
        expr: region
      - name: created_at
        type: time
        type_params:
          time_granularity: day

  - name: metric_dim
    description: "Metric metadata for filtering by topic/group"
    model: ref('dim_metric')
    defaults:
      agg_time_dimension: created_at
    
    entities:
      - name: metric
        type: primary
        expr: metric_key
    
    dimensions:
      - name: metric_name
        type: categorical
        expr: metric_name
      - name: metric_group
        type: categorical
        expr: metric_group
      - name: topic
        type: categorical
        expr: topic
        description: "Environmental, Social, or Governance"
      - name: created_at
        type: time
        type_params:
          time_granularity: day

  - name: esg_metrics
    description: "Granular ESG metrics (400+ metrics)"
    model: ref('fact_esg_metric')
    defaults:
      agg_time_dimension: metric_date
    
    entities:
      - name: metric_fact
        type: primary
        expr: metric_key
      - name: company
        type: foreign
        expr: company_id
      - name: metric
        type: foreign
        expr: metric_id
      - name: unit
        type: foreign
        expr: unit_id
    
    dimensions:
      - name: metric_date
        type: time
        expr: "case when year is not null then cast(cast(year as varchar) || '-01-01' as date) else current_date end"
        type_params:
          time_granularity: year
      - name: source
        type: categorical
    
    measures:
      - name: total_value
        agg: sum
        expr: normalized_value
        description: "Sum of normalized values"
      - name: avg_value
        agg: average
        expr: normalized_value
        description: "Average normalized metric value"
      - name: min_value
        agg: min
        expr: normalized_value
      - name: max_value
        agg: max
        expr: normalized_value
      - name: metric_count
        agg: count
        expr: metric_key
      - name: metric_company_count
        agg: count_distinct
        expr: company_id

  - name: esg_scores
    description: "ESG scores, pulse, and risk ratings from multiple sources"
    model: ref('fact_esg_score_risk')
    defaults:
      agg_time_dimension: score_date
    
    entities:
      - name: score_fact
        type: primary
        expr: score_key
      - name: company
        type: foreign
        expr: company_id
    
    dimensions:
      - name: score_date
        type: time
        expr: "case when year is not null then cast(cast(year as varchar) || '-01-01' as date) else current_date end"
        type_params:
          time_granularity: year
      - name: source
        type: categorical
        expr: source
        description: "esg_level | sp500_risk | sustainability_rank | industrials | esg_crawled"
      - name: total_level
        type: categorical
        expr: total_level
      - name: total_grade
        type: categorical
        expr: total_grade
      - name: esg_risk_level
        type: categorical
        expr: esg_risk_level
      - name: esg_risk_percentile
        type: categorical
        expr: esg_risk_percentile
      - name: controversy_level
        type: categorical
        expr: controversy_level
      - name: score_created_at
        type: time
        expr: created_at
        type_params:
          time_granularity: day
    
    measures:
      - name: avg_overall_score
        agg: average
        expr: overall_score
        description: "Average overall ESG score"
      - name: avg_esg_pulse
        agg: average
        expr: esg_pulse
        description: "Average ESG pulse (real-time activity)"
      - name: avg_risk_score
        agg: average
        expr: total_esg_risk_score
        description: "Average total ESG risk score"
      - name: avg_controversy
        agg: average
        expr: controversy_score
        description: "Average controversy score"
      - name: min_overall_score
        agg: min
        expr: overall_score
      - name: max_overall_score
        agg: max
        expr: overall_score
      - name: score_count
        agg: count
        expr: score_key
      - name: score_company_count
        agg: count_distinct
        expr: company_id

  - name: wba_benchmarks
    description: "WBA global rankings and industry/sector benchmarks"
    model: ref('fact_esg_rank')
    defaults:
      agg_time_dimension: benchmark_date
    
    entities:
      - name: rank_fact
        type: primary
        expr: benchmark_key
      - name: company
        type: foreign
        expr: company_id
    
    dimensions:
      - name: benchmark_date
        type: time
        expr: "cast(cast(year_benchmarked as varchar) || '-01-01' as date)"
        type_params:
          time_granularity: year
      - name: industry
        type: categorical
        expr: industry
      - name: sector
        type: categorical
        expr: sector
      - name: year_benchmarked
        type: categorical
        expr: year_benchmarked
    
    measures:
      - name: global_rank_value
        agg: min 
        expr: total_rank
        description: "WBA global rank (lower is better)"
      - name: governance_rank_value
        agg: min 
        expr: governance_strategy_rank
      - name: environment_rank_value
        agg: min 
        expr: ecosystems_biodiversity_rank
      - name: social_rank_value
        agg: min 
        expr: social_community_rank
      - name: industry_rank_value
        agg: min
        expr: industry_rank
        description: "Rank within industry (lower is better)"
      - name: industry_percentile
        agg: average
        expr: "cast(industry_rank as double) / cast(industry_company_count as double) * 100"
        description: "Industry percentile rank (0-100)"
      - name: sector_rank_value
        agg: min
        expr: sector_rank
        description: "Rank within sector (lower is better)"
      - name: sector_percentile
        agg: average
        expr: "cast(sector_rank as double) / cast(sector_company_count as double) * 100"
        description: "Sector percentile rank (0-100)"

  - name: esg_derived
    description: "Pre-calculated derived ESG metrics (YoY, industry comparisons)"
    model: ref('fact_esg_metric_cal')
    defaults:
      agg_time_dimension: derived_date
    
    entities:
      - name: derived_fact
        type: primary
        expr: derived_key
      - name: company
        type: foreign
        expr: company_id
    
    dimensions:
      - name: derived_date
        type: time
        expr: "cast(cast(year as varchar) || '-01-01' as date)"
        type_params:
          time_granularity: year
      - name: industry
        type: categorical
        expr: industry
      - name: sector
        type: categorical
        expr: sector
      - name: decarbonization_status
        type: categorical
        expr: decarbonization_status
      - name: talent_stability_status
        type: categorical
        expr: talent_stability_status
      - name: governance_status
        type: categorical
        expr: governance_status
    
    measures:
      - name: avg_emissions_yoy
        agg: average
        expr: emissions_yoy_pct
        description: "Average YoY emissions change %"
      - name: avg_decarbonization_gap
        agg: average
        expr: decarbonization_gap
        description: "Average gap vs industry decarbonization"
      - name: avg_turnover_rate
        agg: average
        expr: company_turnover_rate
      - name: avg_talent_gap
        agg: average
        expr: talent_stability_gap
        description: "Average gap vs industry turnover"
      - name: avg_board_independence
        agg: average
        expr: company_board_independence
      - name: avg_board_yoy
        agg: average
        expr: board_independence_yoy
        description: "Average YoY board independence change"
      - name: company_count
        agg: count_distinct
        expr: company_id

metrics:
  - name: company_overall_score
    description: "Company's overall ESG score"
    type: simple
    label: Overall ESG Score
    type_params:
      measure: avg_overall_score

  - name: company_esg_pulse
    description: "Company's ESG pulse (Industrials source only)"
    type: simple
    label: ESG Pulse
    type_params:
      measure: avg_esg_pulse
    filter: |
      {{ Dimension('esg_scores__source') }} = 'industrials'

  - name: company_risk_score
    description: "Company's total ESG risk (SP500 source only)"
    type: simple
    label: ESG Risk Score
    type_params:
      measure: avg_risk_score
    filter: |
      {{ Dimension('esg_scores__source') }} = 'sp500_risk'

  - name: company_controversy_score
    description: "Company's controversy score"
    type: simple
    label: Controversy Score
    type_params:
      measure: avg_controversy
    filter: |
      {{ Dimension('esg_scores__source') }} = 'sp500_risk'

  - name: industry_avg_score
    description: "Industry average ESG score for benchmarking"
    type: simple
    label: Industry Avg ESG Score
    type_params:
      measure: avg_overall_score

  - name: industry_avg_pulse
    description: "Industry average ESG pulse"
    type: simple
    label: Industry Avg ESG Pulse
    type_params:
      measure: avg_esg_pulse
    filter: |
      {{ Dimension('esg_scores__source') }} = 'industrials'

  - name: industry_avg_risk
    description: "Industry average ESG risk"
    type: simple
    label: Industry Avg Risk
    type_params:
      measure: avg_risk_score
    filter: |
      {{ Dimension('esg_scores__source') }} = 'sp500_risk'

  - name: sector_avg_score
    description: "Sector average ESG score"
    type: simple
    label: Sector Avg ESG Score
    type_params:
      measure: avg_overall_score

  - name: high_risk_companies
    description: "Count of companies with high ESG risk"
    type: simple
    label: High Risk Companies
    type_params:
      measure: score_company_count
    filter: |
      {{ Dimension('esg_scores__esg_risk_level') }} = 'high'

  - name: companies_by_risk_level
    description: "Company count by risk level"
    type: simple
    label: Companies by Risk Level
    type_params:
      measure: score_company_count

  - name: top_performers_count
    description: "Companies with ESG score >= 70"
    type: simple
    label: Top Performers
    type_params:
      measure: score_company_count
    filter: |
      {{ Dimension('esg_scores__avg_overall_score') }} >= 70

  - name: poor_performers_count
    description: "Companies with ESG score < 50"
    type: simple
    label: Poor Performers
    type_params:
      measure: score_company_count
    filter: |
      {{ Dimension('esg_scores__avg_overall_score') }} < 50

  - name: wba_global_rank
    description: "Company's WBA global rank"
    type: simple
    label: WBA Global Rank
    type_params:
      measure: global_rank_value

  - name: wba_governance_rank
    description: "Company's WBA governance strategy rank"
    type: simple
    label: WBA Governance Rank
    type_params:
      measure: governance_rank_value

  - name: wba_environment_rank
    description: "Company's WBA environment & biodiversity rank"
    type: simple
    label: WBA Environment Rank
    type_params:
      measure: environment_rank_value

  - name: wba_social_rank
    description: "Company's WBA social & community rank"
    type: simple
    label: WBA Social Rank
    type_params:
      measure: social_rank_value

  - name: wba_industry_rank
    description: "Company's rank within industry"
    type: simple
    label: WBA Industry Rank
    type_params:
      measure: industry_rank_value

  - name: wba_sector_rank
    description: "Company's rank within sector"
    type: simple
    label: WBA Sector Rank
    type_params:
      measure: sector_rank_value

  - name: wba_industry_percentile
    description: "Industry percentile rank (0-100)"
    type: simple
    label: Industry Percentile
    type_params:
      measure: industry_percentile

  - name: wba_sector_percentile
    description: "Sector percentile rank (0-100)"
    type: simple
    label: Sector Percentile
    type_params:
      measure: sector_percentile

  - name: emissions_yoy_change
    description: "YoY emissions change percentage"
    type: simple
    label: Emissions YoY %
    type_params:
      measure: avg_emissions_yoy

  - name: decarbonization_gap
    description: "Company vs industry decarbonization rate"
    type: simple
    label: Decarbonization Gap
    type_params:
      measure: avg_decarbonization_gap

  - name: talent_stability_gap
    description: "Company vs industry turnover rate"
    type: simple
    label: Talent Stability Gap
    type_params:
      measure: avg_talent_gap

  - name: board_independence_yoy
    description: "YoY change in board independence"
    type: simple
    label: Board Independence YoY
    type_params:
      measure: avg_board_yoy

  - name: leading_decarbonizers
    description: "Companies ahead of industry in emissions reduction"
    type: simple
    label: Leading Decarbonizers
    type_params:
      measure: company_count
    filter: |
      {{ Dimension('esg_derived__decarbonization_status') }} IN ('Leading Decarbonization', 'Above Industry Avg')

  - name: excellent_retention_companies
    description: "Companies with excellent employee retention"
    type: simple
    label: Excellent Retention
    type_params:
      measure: company_count
    filter: |
      {{ Dimension('esg_derived__talent_stability_status') }} IN ('Excellent Retention', 'Better Than Industry')

  - name: improving_governance_companies
    description: "Companies improving governance over time"
    type: simple
    label: Improving Governance
    type_params:
      measure: company_count
    filter: |
      {{ Dimension('esg_derived__governance_status') }} IN ('Improving Governance', 'Slight Improvement')